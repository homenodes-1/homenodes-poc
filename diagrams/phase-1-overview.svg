<text x="985.0" y="433" font-size="11.5" font-weight="normal" fill="#5A6672" text-anchor="middle">Node listed on the platform. Renter workloads. Host visibility audit every week.</text>
<rect x="1355.0" y="388" width="92.5" height="60" rx="6" fill="#EBF4EE" stroke="#3E8A5A" stroke-width="1.5"/>
<text x="1401.25" y="414" font-size="12.5" font-weight="bold" fill="#1F2A36" text-anchor="middle">Close-out</text>

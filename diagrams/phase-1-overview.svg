<text x="40" y="612" font-size="12" font-weight="bold" fill="#5A6672" text-anchor="start">WHAT IS MEASURED AND WHAT IS PUBLISHED</text>
<rect x="40" y="628" width="365" height="190" rx="8" fill="#FFFFFF" stroke="#B9C3CD" stroke-width="1.5"/>
<rect x="40" y="636" width="4" height="174" rx="2" fill="#6B4FA0"/>
<rect x="56" y="642" width="46" height="22" rx="11" fill="#F2EEF9" stroke="#6B4FA0" stroke-width="1.2"/>
<text x="79" y="657.5" font-size="12" font-weight="bold" fill="#6B4FA0" text-anchor="middle">RQ1</text>
<text x="112" y="659" font-size="16" font-weight="bold" fill="#1F2A36" text-anchor="start">Host visibility</text>
<text x="56" y="688" font-size="13.5" font-weight="normal" fill="#5A6672" text-anchor="start">What can a host see about the workloads</text>
<text x="56" y="707" font-size="13.5" font-weight="normal" fill="#5A6672" text-anchor="start">and renters on their hardware, using only</text>
<text x="56" y="726" font-size="13.5" font-weight="normal" fill="#5A6672" text-anchor="start">normal host tools?</text>
<line x1="56" y1="766" x2="389" y2="766" stroke="#B9C3CD" stroke-width="1.5"/>
<text x="56" y="786" font-size="10.5" font-weight="bold" fill="#5A6672" text-anchor="start">PUBLISHED</text>
<text x="56" y="804" font-size="13.5" font-weight="bold" fill="#1F2A36" text-anchor="start">Visibility matrix</text>
<rect x="425" y="628" width="365" height="190" rx="8" fill="#FFFFFF" stroke="#B9C3CD" stroke-width="1.5"/>
<rect x="425" y="636" width="4" height="174" rx="2" fill="#6B4FA0"/>
<rect x="441" y="642" width="46" height="22" rx="11" fill="#F2EEF9" stroke="#6B4FA0" stroke-width="1.2"/>
<text x="464" y="657.5" font-size="12" font-weight="bold" fill="#6B4FA0" text-anchor="middle">RQ2</text>
<text x="497" y="659" font-size="16" font-weight="bold" fill="#1F2A36" text-anchor="start">Workload identifiability</text>
<text x="441" y="688" font-size="13.5" font-weight="normal" fill="#5A6672" text-anchor="start">Can power and network data tell types of</text>
<text x="441" y="707" font-size="13.5" font-weight="normal" fill="#5A6672" text-anchor="start">AI workload apart, and at what meter</text>
<text x="441" y="726" font-size="13.5" font-weight="normal" fill="#5A6672" text-anchor="start">resolution does that stop working?</text>
<line x1="441" y1="766" x2="774" y2="766" stroke="#B9C3CD" stroke-width="1.5"/>
<text x="441" y="786" font-size="10.5" font-weight="bold" fill="#5A6672" text-anchor="start">PUBLISHED</text>
<text x="441" y="804" font-size="13.5" font-weight="bold" fill="#1F2A36" text-anchor="start">Accuracy at 1 second, 1 minute, 15 minutes</text>
<rect x="810" y="628" width="365" height="190" rx="8" fill="#FFFFFF" stroke="#B9C3CD" stroke-width="1.5"/>
<rect x="810" y="636" width="4" height="174" rx="2" fill="#6B4FA0"/>
<rect x="826" y="642" width="46" height="22" rx="11" fill="#F2EEF9" stroke="#6B4FA0" stroke-width="1.2"/>
<text x="849" y="657.5" font-size="12" font-weight="bold" fill="#6B4FA0" text-anchor="middle">RQ3</text>
<text x="882" y="659" font-size="16" font-weight="bold" fill="#1F2A36" text-anchor="start">Energy use</text>
<text x="826" y="688" font-size="13.5" font-weight="normal" fill="#5A6672" text-anchor="start">How much energy does a node use in</text>
<text x="826" y="707" font-size="13.5" font-weight="normal" fill="#5A6672" text-anchor="start">each operating state, compared with</text>
<text x="826" y="726" font-size="13.5" font-weight="normal" fill="#5A6672" text-anchor="start">a typical household?</text>
<line x1="826" y1="766" x2="1159" y2="766" stroke="#B9C3CD" stroke-width="1.5"/>
<text x="826" y="786" font-size="10.5" font-weight="bold" fill="#5A6672" text-anchor="start">PUBLISHED</text>
<text x="826" y="804" font-size="13.5" font-weight="bold" fill="#1F2A36" text-anchor="start">Energy dataset and summary</text>
<rect x="1195" y="628" width="365" height="190" rx="8" fill="#FFFFFF" stroke="#B9C3CD" stroke-width="1.5"/>
<rect x="1195" y="636" width="4" height="174" rx="2" fill="#6B4FA0"/>
<rect x="1211" y="642" width="46" height="22" rx="11" fill="#F2EEF9" stroke="#6B4FA0" stroke-width="1.2"/>
<text x="1234" y="657.5" font-size="12" font-weight="bold" fill="#6B4FA0" text-anchor="middle">RQ4</text>
<text x="1267" y="659" font-size="16" font-weight="bold" fill="#1F2A36" text-anchor="start">Governance gaps</text>
<text x="1211" y="688" font-size="13.5" font-weight="normal" fill="#5A6672" text-anchor="start">Where do existing rules give a household</text>
<text x="1211" y="707" font-size="13.5" font-weight="normal" fill="#5A6672" text-anchor="start">no clear answer, from purchase through</text>
<text x="1211" y="726" font-size="13.5" font-weight="normal" fill="#5A6672" text-anchor="start">close-out?</text>
<line x1="1211" y1="766" x2="1544" y2="766" stroke="#B9C3CD" stroke-width="1.5"/>
<text x="1211" y="786" font-size="10.5" font-weight="bold" fill="#5A6672" text-anchor="start">PUBLISHED</text>
<text x="1211" y="804" font-size="13.5" font-weight="bold" fill="#1F2A36" text-anchor="start">Gap log, one entry per gap</text>
<rect x="40" y="848" width="1520" height="96" rx="8" fill="#F8F9FB" stroke="#B9C3CD" stroke-width="1.2"/>
<text x="60" y="878" font-size="11" font-weight="bold" fill="#5A6672" text-anchor="start">NEVER COLLECTED</text>
<text x="60" y="902" font-size="14.5" font-weight="bold" fill="#1F2A36" text-anchor="start">Renter workload contents  ·  Renter identity  ·  Whole-home energy use  ·  Other household network activity</text>
<text x="60" y="926" font-size="13" font-weight="normal" fill="#5A6672" text-anchor="start">One node adds nothing to frontier AI capability. The node exists to produce evidence, and its listing ends with the study.</text>
<text x="40" y="984" font-size="12.5" font-weight="normal" fill="#5A6672" text-anchor="start">Planned design. Hardware has not been purchased yet.</text>
<text x="1560" y="984" font-size="12.5" font-weight="bold" fill="#5A6672" text-anchor="end">homenodes.ca</text>

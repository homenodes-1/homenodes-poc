<rect width="1600" height="1010" fill="#FFFFFF"/>
<text x="40" y="62" font-size="30" font-weight="bold" fill="#1F2A36">Phase 1: single-node study</text>
<text x="40" y="94" font-size="16" fill="#5A6672">One home in Medicine Hat, Alberta. One consumer GPU node. 16 weeks.</text>
<text x="40" y="138" font-size="12" font-weight="bold" fill="#5A6672" text-anchor="start">THE SETUP</text>
<rect x="330" y="150" width="1250" height="170" rx="10" fill="#F8F9FB" stroke="#1F2A36" stroke-width="2"/>
<text x="346" y="172" font-size="13" font-weight="bold" fill="#5A6672" text-anchor="start">One home in Medicine Hat</text>
<rect x="40" y="185" width="250" height="120" rx="8" fill="#FFFFFF" stroke="#B9C3CD" stroke-width="1.5"/>
<rect x="40" y="193" width="4" height="104" rx="2" fill="#2F6FA3"/>
<text x="56" y="213" font-size="16" font-weight="bold" fill="#1F2A36" text-anchor="start">Compute platform</text>
<text x="56" y="235" font-size="13.5" font-weight="normal" fill="#5A6672" text-anchor="start">Public GPU marketplace</text>
<text x="56" y="254" font-size="13.5" font-weight="normal" fill="#5A6672" text-anchor="start">Renters run their own workloads</text>
<text x="56" y="273" font-size="13.5" font-weight="normal" fill="#5A6672" text-anchor="start">Listing ends with the study</text>
<rect x="350" y="185" width="250" height="120" rx="8" fill="#FFFFFF" stroke="#B9C3CD" stroke-width="1.5"/>
<rect x="350" y="193" width="4" height="104" rx="2" fill="#2F6FA3"/>
<text x="366" y="213" font-size="16" font-weight="bold" fill="#1F2A36" text-anchor="start">Dedicated internet line</text>
<text x="366" y="235" font-size="13.5" font-weight="normal" fill="#5A6672" text-anchor="start">Terms permit hosting</text>
<text x="366" y="254" font-size="13.5" font-weight="normal" fill="#5A6672" text-anchor="start">Static public address</text>
<text x="366" y="273" font-size="13.5" font-weight="normal" fill="#5A6672" text-anchor="start">Separate from the household line</text>
<rect x="660" y="185" width="250" height="120" rx="8" fill="#FFFFFF" stroke="#B9C3CD" stroke-width="1.5"/>
<rect x="660" y="193" width="4" height="104" rx="2" fill="#2F6FA3"/>
<text x="676" y="213" font-size="16" font-weight="bold" fill="#1F2A36" text-anchor="start">Firewall</text>
<text x="676" y="235" font-size="13.5" font-weight="normal" fill="#5A6672" text-anchor="start">Node on its own network segment</text>
<text x="676" y="254" font-size="13.5" font-weight="normal" fill="#5A6672" text-anchor="start">Logs volume and connection</text>
<text x="676" y="273" font-size="13.5" font-weight="normal" fill="#5A6672" text-anchor="start">counts, never content</text>
<rect x="970" y="185" width="250" height="120" rx="8" fill="#FFFFFF" stroke="#B9C3CD" stroke-width="1.5"/>
<rect x="970" y="193" width="4" height="104" rx="2" fill="#1F2A36"/>
<text x="986" y="213" font-size="16" font-weight="bold" fill="#1F2A36" text-anchor="start">Node</text>
<text x="986" y="235" font-size="13.5" font-weight="normal" fill="#5A6672" text-anchor="start">One consumer GPU</text>
<text x="986" y="254" font-size="13.5" font-weight="normal" fill="#5A6672" text-anchor="start">Renter workloads in containers</text>
<text x="986" y="273" font-size="13.5" font-weight="normal" fill="#5A6672" text-anchor="start">Host tools only, no inspection</text>
<rect x="1280" y="185" width="280" height="120" rx="8" fill="#FFFFFF" stroke="#B9C3CD" stroke-width="1.5"/>
<rect x="1280" y="193" width="4" height="104" rx="2" fill="#C9811A"/>
<text x="1296" y="213" font-size="16" font-weight="bold" fill="#1F2A36" text-anchor="start">Energy monitor</text>
<text x="1296" y="235" font-size="13.5" font-weight="normal" fill="#5A6672" text-anchor="start">Node circuit only</text>
<text x="1296" y="254" font-size="13.5" font-weight="normal" fill="#5A6672" text-anchor="start">1-second readings</text>
<text x="1296" y="273" font-size="13.5" font-weight="normal" fill="#5A6672" text-anchor="start">Whole-home use is not measured</text>
